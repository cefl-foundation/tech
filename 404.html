<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found - Tech Practice Hub</title>
  <script>
    // GitHub Pages shows this page at the address that was typed, which may be
    // several folders deep. This sets where the links on this page start from:
    // "/tech/" on GitHub Pages, "/" on the Mac.
    (function () {
      const base = document.createElement("base");
      base.href = window.location.pathname.startsWith("/tech/") ? "/tech/" : "/";
      document.head.appendChild(base);
    })();
  </script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
</head>
<body data-page="404.html">
  <div data-layout="header"></div>
  <div data-layout="nav"></div>
  <script src="js/dom.js"></script>
  <script src="js/layout.js"></script>

  <main id="main" tabindex="-1">
    <section class="notice">
      <div class="wrap">
        <h1>Page not found</h1>
        <p>This page does not exist. The link may be wrong, or the page may have moved.</p>
        <p>Go back to the hub and choose a section from there.</p>
        <p><a class="button primary" href="index.html">Back to the hub</a></p>
      </div>
    </section>
  </main>

  <div data-layout="footer"></div>

</body>
</html>
