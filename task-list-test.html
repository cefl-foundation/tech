<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Task list test - Tech Practice Hub</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <div data-layout="header"></div>
  <div data-layout="nav"></div>
  <script src="js/dom.js"></script>
  <script src="js/layout.js"></script>

  <main id="main" tabindex="-1">
    <section class="notice">
      <div class="wrap">
        <h1>Task list test</h1>
        <p>A test page for js/tasks.js: every task in tasks/index.json, in teaching order. It will be removed.</p>
        <ol id="task-list"></ol>
      </div>
    </section>
  </main>

  <div data-layout="footer"></div>

  <script src="js/tasks.js"></script>
  <script>
    // Ask for the index, then add one line to the list for each task.
    (function () {
      "use strict";
      const list = document.getElementById("task-list");
      Tasks.loadIndex()
        .then(function (index) {
          for (const entry of Tasks.flatList(index)) {
            list.appendChild(Dom.make("li", null, "Week " + entry.week + ": " + entry.title + " (" + entry.id + ")"));
          }
        })
        .catch(function (error) {
          list.appendChild(Dom.make("li", null, "The tasks did not load. " + error.message));
        });
    })();
  </script>

</body>
</html>
